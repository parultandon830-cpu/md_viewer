name: Build C++ MD Reader Windows Installer

on:
push:
branches: [ "main", "master" ]
workflow_dispatch:

jobs:
build:
runs-on: windows-latest

steps:
  - name: Checkout Source Code
    uses: actions/checkout@v4

  - name: Install Qt 6
    uses: jurplel/install-qt-action@v3
    with:
      version: '6.6.2'
      host: 'windows'
      target: 'desktop'
      arch: 'win64_msvc2019_64'

  - name: Set up MSVC Developer Prompt
    uses: ilammy/msvc-dev-cmd@v1

  - name: Configure CMake
    run: |
      cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -G "Visual Studio 17 2022" -A x64

  - name: Build Application Binary
    run: |
      cmake --build build --config Release

  - name: Bundle Qt Runtime DLLs (windeployqt)
    shell: pwsh
    run: |
      $ExePath = "build/Release/MDReader.exe"
      windeployqt --release --no-translations --compiler-runtime $ExePath

  - name: Install Inno Setup Compiler
    run: |
      choco install innosetup -y --no-progress

  - name: Build Setup Wizard Installer (ISCC)
    shell: pwsh
    run: |
      & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

  - name: Upload MD Reader Setup Installer (.exe)
    uses: actions/upload-artifact@v4
    with:
      name: MDReader-Setup-Installer
      path: Output/MDReader-Setup-v1.0.exe
